name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o build/ ./...
      # Known-vulnerability scan of the code as built for this platform.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...


  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./scripts/build-linux.sh
      - name: Install the .deb and the tarball, then remove them
        run: |
          dpkg-deb --info build/unison-cue_amd64.deb
          sudo apt-get install -y --no-install-recommends ./build/unison-cue_amd64.deb
          unison-cue -version
          test -f /usr/share/icons/hicolor/128x128/apps/unison-cue.png
          desktop-file-validate /usr/share/applications/unison-cue.desktop || true
          sudo apt-get remove -y unison-cue
          tar -xzf build/UnisonCue-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/unison-cue/install.sh"
          "$HOME/.local/bin/unison-cue" -version
          "$RUNNER_TEMP/unison-cue/install.sh" --uninstall
          test ! -e "$HOME/.local/bin/unison-cue"
