# SPDX-License-Identifier: GPL-3.0-or-later
# Builds all release packages when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0) and attaches them to a draft
# GitHub release for review before publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-macos-windows:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"   # macOS wants 1.2.3, not v1.2.3
          ./scripts/build-macos.sh
          # EMBED_ICON gives the exe its icon, product name and version.
          EMBED_ICON=1 ./scripts/build-windows.sh
          mkdir dist
          cp build/UnisonCue-macOS.zip dist/
          zip -j dist/UnisonCue-windows-x64.zip build/UnisonCue.exe
          zip -j dist/UnisonCue-windows-arm64.zip build/UnisonCue-arm64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-windows
          path: dist/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-linux.sh
          mkdir dist
          cp build/UnisonCue-linux-*.tar.gz build/unison-cue_*.deb dist/
      - name: Check the amd64 package installs and runs
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/unison-cue_amd64.deb
          unison-cue -version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error

  release:
    needs: [build-macos-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      # Attestations: a Sigstore-signed record, kept by GitHub, that each
      # file was built by this workflow from this repository.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          gh release create "$TAG" --draft --verify-tag --title "Unison Cue $TAG" --generate-notes *
